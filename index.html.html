<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RAID Manager — SLC Agrícola</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0D1117;--surface:#161B22;--card:#1C2230;--border:#2A3344;
  --accent:#3B82F6;--accentLo:#1D3461;
  --green:#22C55E;--yellow:#EAB308;--red:#EF4444;--blue:#38BDF8;
  --muted:#8B9AB0;--text:#E2E8F0;--dim:#CBD5E1;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
button{cursor:pointer;font-family:inherit}
a{color:var(--accent);text-decoration:none}

/* LOADING */
#loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
#loading-screen .spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:9998;flex-direction:column;gap:16px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:400px;max-width:calc(100vw - 32px)}
.login-box h1{color:var(--text);font-size:22px;margin-bottom:6px}
.login-box p.sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.login-mode-row{display:flex;gap:10px;margin-bottom:20px}
.mode-btn{flex:1;padding:12px 8px;border-radius:10px;border:2px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:6px}
.mode-btn span{font-size:24px}
.mode-btn.selected{border-color:var(--accent);background:var(--accentLo);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.field input,.field textarea,.field select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;outline:none;width:100%;font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.btn-full{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;margin-top:8px}
.login-error{color:var(--red);font-size:12px;text-align:left;margin-top:10px;display:none;background:#EF444415;border:1px solid #EF444444;border-radius:8px;padding:10px 12px;line-height:1.5;word-break:break-all}

/* DESKTOP */
#app-desktop{display:none;height:100vh;overflow:hidden;flex-direction:row}
#sidebar-desk{width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;gap:2px;overflow-y:auto;height:100vh}
.brand{margin:0 16px 24px;background:var(--accentLo);color:var(--accent);border-radius:8px;padding:10px 14px;font-weight:700;font-size:14px}
.user-chip{margin:0 16px 20px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.avatar-sm{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.uname{color:var(--text);font-size:12px;font-weight:600}
.urole{color:var(--muted);font-size:11px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 20px;background:transparent;color:var(--muted);border:none;border-right:2px solid transparent;text-align:left;font-size:13px;width:100%;transition:all .15s}
.nav-btn.active,.nav-btn:hover{background:var(--accentLo);color:var(--accent);border-right-color:var(--accent);font-weight:600}
.nav-btn.hidden{display:none!important}
.logout-btn{margin:auto 16px 0;background:transparent;border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--muted);font-size:12px;width:calc(100% - 32px);cursor:pointer}
#main-desk{flex:1;overflow-y:auto;padding:28px}

/* MOBILE */
#app-mobile{display:none;flex-direction:column;min-height:100vh}
#mob-topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--surface);border-bottom:1px solid var(--border);z-index:200;display:flex;align-items:center;padding:0 16px;gap:12px}
.brand-mob{color:var(--accent);font-weight:700;font-size:15px;flex:1}
#mob-menu-btn{background:transparent;border:none;color:var(--muted);font-size:22px;padding:4px}
#mob-user-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
#mob-drawer{position:fixed;inset:0;z-index:300;display:none}
#mob-drawer.open{display:block}
#mob-drawer-backdrop{position:absolute;inset:0;background:#000a}
#mob-drawer-panel{position:absolute;top:0;left:0;bottom:0;width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;gap:2px;overflow-y:auto;transform:translateX(-100%);transition:transform .25s ease}
#mob-drawer.open #mob-drawer-panel{transform:translateX(0)}
#mob-bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:200;padding:6px 0;display:flex}
.mob-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;background:transparent;border:none;color:var(--muted);font-size:10px;padding:6px 4px}
.mob-nav-item.active{color:var(--accent)}
.mob-nav-item span:first-child{font-size:20px}
#main-mob{padding:68px 14px 80px;min-height:100vh}

/* SHARED */
.view{display:none;flex-direction:column;gap:20px}
.view.active{display:flex}
.page-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px}
.page-sub{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.card-title{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;display:block}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pbar-wrap{background:var(--border);border-radius:99px;height:6px;overflow:hidden;flex:1;min-width:60px}
.pbar-fill{height:100%;border-radius:99px}
.top-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer}
.btn-ghost{background:transparent;border:1px solid var(--border);border-radius:8px;padding:9px 16px;font-size:13px;color:var(--muted);cursor:pointer}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px;border:none;font-weight:600;cursor:pointer}
.btn-danger{background:#EF444420;color:#EF4444;border:1px solid #EF444444!important}
.input-field{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;width:100%;font-family:inherit}
.input-field:focus{border-color:var(--accent)}
select.input-field{appearance:none}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 22px;border-top:3px solid var(--accent);transition:all .15s}
.kpi-card.clickable{cursor:pointer}
.kpi-card.clickable:hover{opacity:.85;transform:translateY(-1px)}
.kpi-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px}
.kpi-value{color:var(--text);font-size:34px;font-weight:700;font-family:'Georgia',serif;display:block}
.kpi-sub{color:var(--muted);font-size:12px;display:block;margin-top:4px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;cursor:pointer}
.filter-btn.active{border-color:var(--accent);background:var(--accentLo);color:var(--accent);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:11px 14px;text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;background:var(--surface);white-space:nowrap}
.tbl td{padding:13px 14px;border-top:1px solid var(--border)}
.tbl tr:hover td{background:#ffffff05}
.tbl a{color:var(--accent);font-weight:700;text-decoration:underline}
.hide-mob{}
.tl-h{display:flex;align-items:flex-start;overflow-x:auto;padding:20px 0}
.tl-step{display:flex;flex-direction:column;align-items:center;position:relative;flex:1;min-width:130px}
.tl-step:not(:last-child)::after{content:'';position:absolute;top:14px;left:50%;width:100%;height:2px;background:var(--border);z-index:0}
.tl-step.done:not(:last-child)::after{background:var(--green)}
.tl-dot-h{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:1;position:relative;border:2px solid}
.tl-label-h{font-size:11px;font-weight:600;margin-top:8px;text-align:center}
.tl-date-h{font-size:10px;color:var(--muted);margin-top:3px;text-align:center}
.step-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}
.step-card{border-radius:10px;padding:16px 12px;text-align:center;border:1px solid var(--border);transition:all .2s}
.step-card.done{background:#22C55E15;border-color:var(--green)}
.step-card.current{background:#EAB30815;border-color:var(--yellow)}
.step-card.pending{background:var(--card)}
.step-card.clickable-step{cursor:pointer}
.step-card.clickable-step:hover{filter:brightness(1.1)}
.modal-overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;width:560px;max-width:calc(100vw - 24px);max-height:88vh;overflow-y:auto}
.modal h3{color:var(--text);font-size:17px;font-weight:700;margin-bottom:16px}
.modal-close{float:right;background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;margin-top:-4px}
.rank-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;display:flex;align-items:center;gap:16px;margin-bottom:8px}
.rank-item.gold{border-color:var(--accent)}
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.tab-btn{padding:8px 18px;border:none;background:transparent;color:var(--muted);font-size:13px;border-bottom:2px solid transparent;transition:all .15s;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab-btn.active{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
.stage-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:10px}
.req-item{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:6px;padding:7px 10px;margin-top:6px;font-size:12px;color:var(--dim)}
.req-item button{background:var(--red);color:#fff;border:none;border-radius:4px;padding:2px 7px;font-size:11px;margin-left:auto;cursor:pointer}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.step-info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.step-info-row:last-child{border-bottom:none}
.download-btn{display:inline-flex;align-items:center;gap:6px;background:var(--accentLo);color:var(--accent);border:1px solid rgba(59,130,246,.3);border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none}
.fw-600{font-weight:600}.fs-12{font-size:12px}.fs-13{font-size:13px}
.mt-4{margin-top:4px}.mt-8{margin-top:8px}
.text-muted{color:var(--muted)}.text-dim{color:var(--dim)}.text-main{color:var(--text)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}
@media(max-width:768px){
  .kpi-grid{grid-template-columns:1fr 1fr}.two-col{grid-template-columns:1fr}
  .step-cards{grid-template-columns:repeat(3,1fr)}.hide-mob{display:none}
  .rank-item{flex-wrap:wrap}
}
@media(max-width:400px){.kpi-grid{grid-template-columns:1fr}.step-cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading-screen">
  <div class="spin"></div>
  <p style="color:var(--muted);font-size:14px">Conectando ao banco de dados…</p>
</div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>🛡 RAID Manager</h1>
    <p class="sub">SLC Agrícola — Sistema de Gestão de Processos RAID</p>
    <div class="login-mode-row">
      <button class="mode-btn selected" id="mode-desktop" onclick="selectMode('desktop')"><span>🖥️</span>Computador</button>
      <button class="mode-btn" id="mode-mobile" onclick="selectMode('mobile')"><span>📱</span>Celular</button>
    </div>
    <div class="field"><label>E-mail</label><input type="email" id="login-email" placeholder="seu@email.com"/></div>
    <div class="field"><label>Senha</label><input type="password" id="login-pwd" placeholder="••••••••"/></div>
    <button class="btn-full" id="login-btn" onclick="doLogin()">Entrar</button>
    <p class="login-error" id="login-err">E-mail ou senha inválidos.</p>
  </div>
</div>

<!-- DESKTOP -->
<div id="app-desktop">
  <nav id="sidebar-desk">
    <div class="brand">🛡 RAID Manager</div>
    <div class="user-chip">
      <div class="avatar-sm" id="d-av"></div>
      <div><div class="uname" id="d-name"></div><div class="urole" id="d-role"></div></div>
    </div>
    <button class="nav-btn active" onclick="deskNav('dashboard',this)"><span>⬛</span> Dashboard</button>
    <button class="nav-btn" onclick="deskNav('processos',this)"><span>📋</span> Processos</button>
    <button class="nav-btn" id="d-nav-tl" onclick="deskNav('timeline',this)"><span>⏱</span> Avançar Etapas</button>
    <button class="nav-btn" onclick="deskNav('ranking',this)"><span>🏆</span> Ranking</button>
    <button class="nav-btn" id="d-nav-et" onclick="deskNav('etapas',this)"><span>⚙️</span> Etapas</button>
    <button class="nav-btn" id="d-nav-cad" onclick="deskNav('cadastros',this)"><span>🗂</span> Cadastros</button>
    <button class="logout-btn" onclick="doLogout()">↩ Sair</button>
  </nav>
  <main id="main-desk"><div id="d-views"></div></main>
</div>

<!-- MOBILE -->
<div id="app-mobile">
  <div id="mob-topbar">
    <button id="mob-menu-btn" onclick="toggleDrawer()">☰</button>
    <span class="brand-mob">🛡 RAID Manager</span>
    <div id="mob-user-dot"></div>
  </div>
  <div id="mob-drawer">
    <div id="mob-drawer-backdrop" onclick="toggleDrawer()"></div>
    <div id="mob-drawer-panel">
      <div class="brand" style="margin:0 16px 16px">🛡 RAID Manager</div>
      <div class="user-chip" style="margin:0 16px 16px">
        <div class="avatar-sm" id="m-av"></div>
        <div><div class="uname" id="m-name"></div><div class="urole" id="m-role"></div></div>
      </div>
      <button class="nav-btn" onclick="mobNav('dashboard')"><span>⬛</span> Dashboard</button>
      <button class="nav-btn" onclick="mobNav('processos')"><span>📋</span> Processos</button>
      <button class="nav-btn" id="m-nav-tl" onclick="mobNav('timeline')"><span>⏱</span> Avançar Etapas</button>
      <button class="nav-btn" onclick="mobNav('ranking')"><span>🏆</span> Ranking</button>
      <button class="nav-btn" id="m-nav-et" onclick="mobNav('etapas')"><span>⚙️</span> Etapas</button>
      <button class="nav-btn" id="m-nav-cad" onclick="mobNav('cadastros')"><span>🗂</span> Cadastros</button>
      <button class="logout-btn" style="margin:16px" onclick="doLogout()">↩ Sair</button>
    </div>
  </div>
  <main id="main-mob"><div id="m-views"></div></main>
  <div id="mob-bottomnav">
    <button class="mob-nav-item active" id="mb-dashboard" onclick="mobNav('dashboard')"><span>⬛</span>Dashboard</button>
    <button class="mob-nav-item" id="mb-processos" onclick="mobNav('processos')"><span>📋</span>Processos</button>
    <button class="mob-nav-item" id="mb-timeline" onclick="mobNav('timeline')"><span>⏱</span>Etapas</button>
    <button class="mob-nav-item" id="mb-ranking" onclick="mobNav('ranking')"><span>🏆</span>Ranking</button>
    <button class="mob-nav-item" onclick="toggleDrawer()"><span>☰</span>Menu</button>
  </div>
</div>

<div class="modal-overlay" id="modal"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════ SUPABASE — DIRECT FETCH (bypass DataCloneError) ═══════
const SUPA_URL = 'https://lkhggvxyrderefwrsgrt.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxraGdndnh5cmRlcmVmd3JzZ3J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDkzOTgsImV4cCI6MjA5NjEyNTM5OH0.Y4hof2dHa5r6O-G1npeN9FwxpSL8YCE4uwjVna3ogjY';

const HEADERS = {
  'apikey': SUPA_KEY,
  'Authorization': 'Bearer ' + SUPA_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

// Generic REST helpers
async function dbSelect(table, params=''){
  const res = await fetch(`${SUPA_URL}/rest/v1/${table}?${params}`, {headers: HEADERS});
  if(!res.ok){ const t=await res.text(); throw new Error(`${table}: ${res.status} ${t}`); }
  return res.json();
}
async function dbInsert(table, body){
  const res = await fetch(`${SUPA_URL}/rest/v1/${table}`, {method:'POST', headers: HEADERS, body: JSON.stringify(body)});
  if(!res.ok){ const t=await res.text(); throw new Error(`INSERT ${table}: ${res.status} ${t}`); }
  return res.json();
}
async function dbUpdate(table, id, body){
  const res = await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`, {method:'PATCH', headers:{...HEADERS,'Prefer':'return=representation'}, body: JSON.stringify(body)});
  if(!res.ok){ const t=await res.text(); throw new Error(`UPDATE ${table}: ${res.status} ${t}`); }
  return res.json();
}
async function dbDelete(table, id){
  const res = await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`, {method:'DELETE', headers: HEADERS});
  if(!res.ok){ const t=await res.text(); throw new Error(`DELETE ${table}: ${res.status} ${t}`); }
}
async function dbUpsert(table, body, onConflict='id'){
  const res = await fetch(`${SUPA_URL}/rest/v1/${table}?on_conflict=${onConflict}`, {
    method:'POST', headers:{...HEADERS,'Prefer':'resolution=merge-duplicates,return=representation'},
    body: JSON.stringify(body)
  });
  if(!res.ok){ const t=await res.text(); throw new Error(`UPSERT ${table}: ${res.status} ${t}`); }
  return res.json();
}

// File upload to Supabase Storage via REST
async function uploadFile(bucket, path, file){
  const res = await fetch(`${SUPA_URL}/storage/v1/object/${bucket}/${path}`, {
    method: 'POST',
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': file.type||'application/pdf' },
    body: file
  });
  if(!res.ok) return null;
  return `${SUPA_URL}/storage/v1/object/public/${bucket}/${path}`;
}

// Keep sb as a thin stub so existing code that references sb doesn't break
const sb = {
  from: ()=>({ select:()=>null, insert:()=>null, update:()=>null, delete:()=>null }),
  storage: { from: ()=>({ upload:()=>null, getPublicUrl:()=>({data:{publicUrl:null}}) }) }
};

// ═══════════════════ STATE ═══════════════════
let currentUser=null, currentRaid=null, procFilter="Todos", currentTab="fazendas", appMode="desktop", loginMode="desktop";
let DB = { usuarios:[], fazendas:[], cargos:[], colaboradores:[], etapas_config:[], raids:[], raid_etapas:[] };

// ═══════════════════ HELPERS ═══════════════════
const slaColor=s=>s==="ok"?"#22C55E":s==="proximo"?"#EAB308":s==="atrasado"?"#EF4444":"#38BDF8";
const slaLabel=s=>s==="ok"?"Dentro do Prazo":s==="proximo"?"Próximo do Prazo":s==="atrasado"?"Atrasado":"Concluído";
const medal=i=>["🥇","🥈","🥉"][i]||`${i+1}º`;

const etapaConfig=i=>DB.etapas_config.find(e=>e.ordem===i+1)||{nome:"—",cor:"#888",responsavel:"—"};
const isAdmin=()=>currentUser?.perfil==="Admin";
const isPrivileged=()=>currentUser&&(currentUser.perfil==="Admin"||currentUser.perfil==="QSSMA");
const pct=r=>r.status==="Concluído"?100:Math.round(((r.etapa_atual-1)/5)*100);

function fmtDate(dt){ if(!dt)return "—"; return new Date(dt).toLocaleDateString("pt-BR"); }
function fmtDatetime(dt){ if(!dt)return "—"; const d=new Date(dt); return d.toLocaleDateString("pt-BR")+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }
function duracao(ini,fim){
  if(!ini)return "—";
  const ms=(fim?new Date(fim):new Date())-new Date(ini);
  const h=Math.round(ms/3600000);
  return h<24?h+"h":Math.round(h/24)+" dias";
}

function showToast(msg, type="success"){
  const t=document.getElementById("toast");

  setTimeout(()=>t.className="toast",2800);
}

function safeArr(data){ return Array.isArray(data)?data:[]; }

async function loadAll(){
  console.log("📦 Fetching all tables via REST...");
  const [usuarios, fazendas, cargos, colaboradores, etapas_config, raids, raid_etapas] = await Promise.all([
    dbSelect("usuarios",      "select=id,nome,email,senha_hash,perfil,cor,ativo&order=nome"),
    dbSelect("fazendas",      "select=id,nome,codigo,municipio,estado&order=nome"),
    dbSelect("cargos",        "select=id,nome,area,nivel&order=nome"),
    dbSelect("colaboradores", "select=id,nome,matricula,cargo_id,fazenda_id,email,gestor_id&order=nome"),
    dbSelect("etapas_config", "select=id,ordem,nome,responsavel,sla_dias,cor,requisitos,campos&order=ordem"),
    dbSelect("raids",         "select=id,numero_raid,fazenda_id,setor,colaborador_nome,coordenador_id,data_ocorrencia,data_abertura,status,etapa_atual,sla_status,dias_total,created_by,created_at,updated_at&order=created_at.desc"),
    dbSelect("raid_etapas",   "select=id,raid_id,etapa_ordem,responsavel_id,inicio,fim,obs,anexo_nome,anexo_url,campos&order=etapa_ordem"),
  ]);
  DB.usuarios      = safeArr(usuarios);
  DB.fazendas      = safeArr(fazendas);
  DB.cargos        = safeArr(cargos);
  DB.colaboradores = safeArr(colaboradores);
  DB.etapas_config = safeArr(etapas_config);
  DB.raids         = safeArr(raids);
  DB.raid_etapas   = safeArr(raid_etapas);
  console.log("✅ loadAll done — raids:", DB.raids.length, "usuarios:", DB.usuarios.length);
}

function selectMode(m){
  loginMode=m;
  document.getElementById("mode-desktop").classList.toggle("selected",m==="desktop");
  document.getElementById("mode-mobile").classList.toggle("selected",m==="mobile");
}

async function doLogin(){
  const email=document.getElementById("login-email").value.trim();
  const pwd=document.getElementById("login-pwd").value;
  const btn=document.getElementById("login-btn");
  const errEl=document.getElementById("login-err");
  btn.textContent="Verificando…"; btn.disabled=true; errEl.style.display="none";

  // DIAGNÓSTICO — testa conexão e query passo a passo
  try {
    // Passo 1: conexão básica
    const _ping = await dbSelect("usuarios", "select=id&limit=1").catch(e=>{ errEl.textContent="❌ Erro de conexão: "+e.message; errEl.style.display="block"; btn.textContent="Entrar"; btn.disabled=false; return null; });
    if(!_ping) return;

    // Passo 2: busca por e-mail
    const byEmail = await dbSelect("usuarios", "select=id,nome,email,senha_hash,perfil,ativo,cor&email=eq."+encodeURIComponent(email));
    if(!byEmail||byEmail.length===0){ errEl.textContent="❌ E-mail não encontrado no banco."; errEl.style.display="block"; btn.textContent="Entrar"; btn.disabled=false; return; }

    const u=byEmail[0];
    // Passo 3: verifica ativo
    if(!u.ativo){ errEl.textContent="❌ Usuário encontrado mas está inativo (ativo=false)."; errEl.style.display="block"; btn.textContent="Entrar"; btn.disabled=false; return; }

    // Passo 4: verifica senha
    if(u.senha_hash!==pwd){ errEl.textContent=`❌ Senha incorreta. Valor no banco: "${u.senha_hash}" — você digitou: "${pwd}"`; errEl.style.display="block"; btn.textContent="Entrar"; btn.disabled=false; return; }

    // Login OK
    currentUser=u; appMode=loginMode;
    document.getElementById("login-screen").style.display="none";
    if(appMode==="desktop"){ document.getElementById("app-desktop").style.display="flex"; setupDesk(); }
    else { document.getElementById("app-mobile").style.display="flex"; setupMob(); }
    buildViews(); initAll();

  } catch(e) {
    errEl.textContent="❌ Exceção JS: "+e.message;
    errEl.style.display="block";
  }
  btn.textContent="Entrar"; btn.disabled=false;
}

function doLogout(){
  currentUser=null; currentRaid=null;
  document.getElementById("app-desktop").style.display="none";
  document.getElementById("app-mobile").style.display="none";
  document.getElementById("login-screen").style.display="flex";
  document.getElementById("login-email").value="";
  document.getElementById("login-pwd").value="";
  document.getElementById("login-err").style.display="none";
}

function goProcessos(filter){
  goProcessosSla(filter==="Concluído"?"concluido":filter==="Em Andamento"?"andamento":"todos");

function goProcessosSla(sla){
  // Map sla key to filter value
  const filterMap={todos:"Todos",andamento:"Em Andamento",concluido:"sla:concluido",ok:"sla:ok",proximo:"sla:proximo",atrasado:"sla:atrasado"};
  procFilter=filterMap[sla]||"Todos";
  // Activate the right button
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  const btnMap={
    "Todos":"fb-todos","Em Andamento":"fb-andamento",
    "sla:ok":"fb-ok","sla:proximo":"fb-proximo",
    "sla:atrasado":"fb-atrasado","sla:concluido":"fb-concluidos-sla",
    "Concluído":"fb-concluido"
  };
  document.getElementById(btnMap[procFilter]||"fb-todos")?.classList.add("active");
  renderTable();
  if(appMode==="desktop") deskNav("processos",document.querySelectorAll("#sidebar-desk .nav-btn")[1]);
  else mobNav("processos");
}
function filterProc(f,btn){
  procFilter=f;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
  renderTable();
}
function toggleDrawer(f){

}

// ═══════════════════ DASHBOARD ═══════════════════
function initDashboard(){
  const raids=DB.raids;
  const abertos=raids.filter(r=>r.status==="Em Andamento");
  const concluidos=raids.filter(r=>r.status==="Concluído");
  const avgPct=abertos.length?(abertos.reduce((s,r)=>s+pct(r),0)/abertos.length).toFixed(1):0;
  const avgT=concluidos.length?(concluidos.reduce((s,r)=>s+(r.dias_total||0),0)/concluidos.length).toFixed(1):0;
  document.getElementById("kpi-abertos").textContent=abertos.length;
  document.getElementById("kpi-concluidos").textContent=concluidos.length;
  document.getElementById("kpi-pct").textContent=avgPct+"%";
  document.getElementById("kpi-tempo").textContent=avgT;

  const qtOk=abertos.filter(r=>r.sla_status==="ok").length;
  const qtProx=abertos.filter(r=>r.sla_status==="proximo").length;
  const qtAtr=abertos.filter(r=>r.sla_status==="atrasado").length;
  const grupos=[
    {l:"Dentro do Prazo",qt:qtOk,   c:"#22C55E",sla:"ok"},
    {l:"Próximo do Prazo",qt:qtProx, c:"#EAB308",sla:"proximo"},
    {l:"Atrasado",        qt:qtAtr,  c:"#EF4444",sla:"atrasado"},
    {l:"Concluído",       qt:concluidos.length,c:"#38BDF8",sla:"concluido"},
  ];
  document.getElementById("status-legend").innerHTML=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%">${grupos.map(g=>`
    <div onclick="goProcessosSla('${g.sla}')" style="background:${g.c}12;border:1px solid ${g.c}44;border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s" onmouseover="this.style.background='${g.c}25'" onmouseout="this.style.background='${g.c}12'">
      <div style="display:flex;align-items:center;gap:5px;margin-bottom:6px">
        <div style="width:8px;height:8px;border-radius:50%;background:${g.c}"></div>
        <span style="color:${g.c};font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em">${g.l}</span>
      </div>
      <span style="color:var(--text);font-size:26px;font-weight:700;font-family:'Georgia',serif">${g.qt}</span>
      <p style="color:${g.c};font-size:10px;margin-top:4px">Ver processos →</p>
    </div>`).join("")}</div>`;
  document.getElementById("status-strip").innerHTML=grupos.map(g=>`<div onclick="goProcessosSla('${g.sla}')" style="flex:1;height:8px;border-radius:4px;background:${g.c};cursor:pointer;transition:opacity .15s" title="${g.l}: ${g.qt}" onmouseover="this.style.opacity='.7'" onmouseout="this.style.opacity='1'"></div>`).join("");

  const ranking=calcRanking();
  document.getElementById("dash-ranking").innerHTML=ranking.slice(0,4).map((c,i)=>`
    <div style="display:flex;align-items:center;gap:14px;padding:10px 0;border-top:${i>0?"1px solid var(--border)":"none"}">
      <span style="font-size:22px;width:28px;text-align:center">${medal(i)}</span>
      <div style="flex:1"><p class="text-main fw-600 fs-13">${c.nome}</p>
        <p class="text-muted" style="font-size:11px;margin-top:2px">${c.processos} processos · ${c.taxa}% conclusão</p></div>
      <span class="text-main fw-600">${c.tempMedio} dias</span>
    </div>`).join("");
}

// ═══════════════════ PROCESSOS ═══════════════════
function initProcessos(){
  document.getElementById("proc-count").textContent=DB.raids.length+" processos";
  // Populate coordenador dropdown
  const coords=[...new Set(DB.raids.map(r=>r.coordenador_id).filter(Boolean))];
  const flCoord=document.getElementById("fl-coord");
  if(flCoord){
    const prev=flCoord.value;
    flCoord.innerHTML='<option value="">Todos</option>'+
      coords.map(id=>{const u=getUserById(id);return `<option value="${id}" ${prev===id?"selected":""}>${u.nome}</option>`;}).join("");
  }
  // Populate setor dropdown from raids.setor field
  const setores=[...new Set(DB.raids.map(r=>r.setor).filter(Boolean))].sort();
  const flSetor=document.getElementById("fl-setor");
  if(flSetor){

}

function renderTable(){
  let data=DB.raids;
  // Status/SLA filter
  if(procFilter==="Em Andamento")        data=data.filter(r=>r.status==="Em Andamento");
  else if(procFilter==="Concluído")      data=data.filter(r=>r.status==="Concluído");
  else if(procFilter==="sla:ok")         data=data.filter(r=>r.status==="Em Andamento"&&r.sla_status==="ok");
  else if(procFilter==="sla:proximo")    data=data.filter(r=>r.status==="Em Andamento"&&r.sla_status==="proximo");
  else if(procFilter==="sla:atrasado")   data=data.filter(r=>r.status==="Em Andamento"&&r.sla_status==="atrasado");
  else if(procFilter==="sla:concluido")  data=data.filter(r=>r.status==="Concluído");
  // Dropdown filters
  const filtCoord=document.getElementById("fl-coord")?.value||"";
  const filtSetor=document.getElementById("fl-setor")?.value||"";
  if(filtCoord) data=data.filter(r=>r.coordenador_id===filtCoord);
  if(filtSetor) data=data.filter(r=>(r.setor||"")===filtSetor);
  // Update count
  const labels={"Todos":"processos","Em Andamento":"em andamento","Concluído":"concluídos","sla:ok":"dentro do prazo","sla:proximo":"próximos do prazo","sla:atrasado":"atrasados","sla:concluido":"concluídos"};
  const extras=[(filtCoord?` · coord. ${getUserById(filtCoord).nome}`:""), (filtSetor?` · setor ${filtSetor}`:"")].join("");
  document.getElementById("proc-count").textContent=`${data.length} ${labels[procFilter]||"processos"}${extras}`;
  document.getElementById("proc-tbody").innerHTML=data.map(r=>{
    const f=getFazenda(r.fazenda_id), c=getUserById(r.coordenador_id), p=pct(r);
    const ec=etapaConfig(r.etapa_atual-1);
    const slaC=r.status==="Concluído"?"#38BDF8":slaColor(r.sla_status);
    const setorCell=r.setor?r.setor:'<span style="color:var(--border)">—</span>';
    const etapaLabel=r.status==="Concluído"?"Concluída":"Etapa "+r.etapa_atual+" — "+ec.nome;
    const slaText=r.status==="Em Andamento"?slaLabel(r.sla_status):"Concluído";
    return "<tr>"+
      `<td style="white-space:nowrap"><a href="#" onclick="openRaidTimeline('${r.id}');return false">${r.numero_raid}</a></td>`+
      `<td class="text-dim hide-mob">${f.nome}</td>`+
      `<td class="text-dim hide-mob">${setorCell}</td>`+
      `<td class="text-dim hide-mob">${r.colaborador_nome||"—"}</td>`+
      `<td class="text-dim hide-mob">${c.nome}</td>`+
      `<td class="text-muted hide-mob" style="white-space:nowrap">${fmtDate(r.data_abertura)}</td>`+
      `<td style="min-width:100px"><div style="display:flex;align-items:center;gap:8px">${pbar(p,ec.cor||"#888")}<span class="text-main fw-600 fs-12" style="white-space:nowrap">${p}%</span></div></td>`+
      `<td>${badge(etapaLabel,r.status==="Concluído"?"#38BDF8":ec.cor||"#888")}</td>`+
      `<td><div style="display:flex;align-items:center;gap:6px"><div style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:${slaC}"></div>${badge(slaText,slaC)}</div></td>`+

function updDot(fid){
  const el=document.getElementById("rf-"+fid), dot=document.getElementById("dot-"+fid);
  if(!el||!dot)return;
  const ok=el.value&&el.value.trim()!=="";
  dot.textContent=ok?"✔":"○"; dot.style.color=ok?"#22C55E":"#2A3344";
}

async function concludeStep(idx){
  const r=currentRaid, ec=DB.etapas_config[idx], etapas=etapasDoRaid(r), ep=etapas[idx]||{};
  const skipIds=idx===0?["num_raid","data_ocorr","hora_ocorr","local","coord_emit"]:[];
  const allFields=parseJson(ec.campos,[]);
  const fields=allFields.filter(f=>!skipIds.includes(f.id));
  const file=document.getElementById("step-file")?.files[0];
  const missing=[];
  fields.forEach(f=>{
    if(!f.req) return;
    if(f.type==="file"){const el=document.getElementById("rf-"+f.id);if((!el||!el.files?.length)&&!(ep.campos||{})[f.id])missing.push(f.label);}
    else{const el=document.getElementById("rf-"+f.id);if(!el||!el.value.trim())missing.push(f.label);}
  });
  if(!file&&!ep.anexo_nome) missing.push("Documento/Evidência (PDF)");
  if(missing.length){alert("Preencha os campos obrigatórios:\n\n• "+missing.join("\n• "));return;}
  // Build campos - only plain serializable values, never File objects
  const campos={...(ep.campos||{})};
  fields.forEach(f=>{
    if(f.type==="file"){
      // Store only the filename string, not the File object
      const el=document.getElementById("rf-"+f.id);
      if(el?.files?.[0]) campos[f.id]=el.files[0].name;
    } else {
      const el=document.getElementById("rf-"+f.id);
      if(el) campos[f.id]=String(el.value||"");
    }
  });
  const now=new Date().toISOString();
  let anexo_nome=ep.anexo_nome, anexo_url=ep.anexo_url||null;
  if(file){
    anexo_nome=file.name;
    const path=`${r.id}/etapa-${idx+1}/${Date.now()}-${file.name}`;
    const _url=await uploadFile("raid-anexos",path,file);
    if(_url) anexo_url=_url;
  }
  await dbUpdate("raid_etapas",ep.id,{fim:now,campos,obs:campos.obs||"",anexo_nome,anexo_url,updated_at:now});
  const next=idx+1;
  if(next<5){
    const nextEp=etapas[next];
    if(nextEp?.id) await dbUpdate("raid_etapas",nextEp.id,{inicio:now,updated_at:now});
    await dbUpdate("raids",r.id,{etapa_atual:next+1,status:"Em Andamento",updated_at:now});
  } else {
    const dias=Math.round((new Date()-new Date(etapas[0]?.inicio||r.data_abertura))/86400000);
    await dbUpdate("raids",r.id,{etapa_atual:5,status:"Concluído",dias_total:dias,updated_at:now});
  }
  showToast("Etapa concluída com sucesso! ✅");
  closeModal(); await loadAll(); currentRaid=DB.raids.find(x=>x.id===r.id); renderTimeline(); initDashboard(); initProcessos();
}

async function forceStep(raidId){
  const sel=document.getElementById("force-step");
  if(!sel){showToast("Selecione uma etapa","error");return;}
  const step=parseInt(sel.value);
  const now=new Date().toISOString();
  await dbUpdate("raids",raidId,{etapa_atual:step,status:"Em Andamento",updated_at:now});
  // Atualiza etapas: completa anteriores, abre atual, limpa próximas
  const etapas=etapasDoRaid({id:raidId});
  for(let i=0;i<5;i++){
    const ep=etapas[i];
    if(!ep) continue;
    if(i<step-1 && !ep.fim){
      await dbUpdate("raid_etapas",ep.id,{fim:now,updated_at:now});
    } else if(i===step-1){
      await dbUpdate("raid_etapas",ep.id,{inicio:ep.inicio||now,fim:null,updated_at:now});
    } else if(i>step-1 && ep.inicio){
      await dbUpdate("raid_etapas",ep.id,{inicio:null,fim:null,updated_at:now});
    }
  }
  showToast("Etapa forçada para "+step+" ✅");
  closeModal(); await loadAll(); currentRaid=DB.raids.find(x=>x.id===raidId); renderTimeline();
}

// ═══════════════════ RANKING ═══════════════════
function calcRanking(){
  return DB.usuarios.filter(u=>u.perfil==="Coordenador"||u.perfil==="QSSMA").map(u=>{
    const tempos=DB.raid_etapas.filter(e=>e.responsavel_id===u.id&&e.inicio&&e.fim)
      .map(e=>(new Date(e.fim)-new Date(e.inicio))/86400000);
    const tratados=DB.raids.filter(r=>DB.raid_etapas.some(e=>e.raid_id===r.id&&e.responsavel_id===u.id&&e.fim));
    const avg=tempos.length?(tempos.reduce((a,b)=>a+b,0)/tempos.length).toFixed(1):"-";
    const taxa=tratados.length?Math.round(tratados.filter(r=>r.status==="Concluído").length/tratados.length*100):0;
    return {nome:u.nome,processos:tratados.length,tempMedio:avg,taxa,cor:u.cor};
  }).sort((a,b)=>(parseFloat(a.tempMedio)||99)-(parseFloat(b.tempMedio)||99));
}
function renderRanking(){
  const rk=calcRanking(), colors=["#22C55E","#22C55E88","#EAB308","#EF4444"];
  document.getElementById("ranking-list").innerHTML=rk.map((c,i)=>`
    <div class="rank-item ${i===0?"gold":""}">
      <span style="font-size:26px;width:32px;text-align:center">${medal(i)}</span>
      <div style="flex:1"><p class="text-main fw-600 fs-13">${c.nome}</p>
        <div style="display:flex;gap:18px;margin-top:6px;flex-wrap:wrap">
          <span class="text-muted fs-12">⏱ <b class="text-main">${c.tempMedio} dias</b></span>
          <span class="text-muted fs-12">📋 <b class="text-main">${c.processos}</b></span>
          <span class="text-muted fs-12">✅ <b style="color:var(--green)">${c.taxa}%</b></span>
        </div></div>
      <div style="min-width:120px"><p class="text-muted" style="font-size:10px;margin-bottom:5px;text-align:right">Tempo médio</p>
        ${pbar(Math.max(0,(5-parseFloat(c.tempMedio||5))/5*100),colors[i]||"#EF4444")}</div>
    </div>`).join("")||`<p class="text-muted" style="text-align:center;padding:20px">Sem dados suficientes para ranking.</p>`;
}

async function saveCampo(ecId,i){
  const label=document.getElementById("nc-label").value.trim();
  const id=document.getElementById("nc-id").value.trim().replace(/\s+/g,"_");

  const opts=document.getElementById("nc-opts")?.value;
  const req=document.getElementById("nc-req")?.checked!==false;
  if(!label||!id){alert("Nome e ID são obrigatórios.");return;}

async function saveNovaRaid(){
  const num=document.getElementById("nr-num").value.trim();
  const ocorr=document.getElementById("nr-ocorr").value;
  const fazId=document.getElementById("nr-faz").value;
  const setor=document.getElementById("nr-setor").value.trim();
  const colab=document.getElementById("nr-colab").value;
  const qssmaId=document.getElementById("nr-qssma").value;
  const coordId=document.getElementById("nr-coord").value;
  const manutId=document.getElementById("nr-manut").value;
  const rhId=document.getElementById("nr-rh").value;
  const desc=document.getElementById("nr-desc").value.trim();
  const file=document.getElementById("nr-file")?.files[0];
  const missing=[];
  if(!num)missing.push("Número da RAID"); if(!ocorr)missing.push("Data da Ocorrência");
  if(!fazId)missing.push("Fazenda"); if(!setor)missing.push("Setor");
  if(!colab)missing.push("Colaborador");
  if(!qssmaId)missing.push("Coordenador Emitente"); if(!coordId)missing.push("Coordenador Responsável");
  if(!desc)missing.push("Descrição da Ocorrência");
  if(missing.length){alert("Preencha:\n\n• "+missing.join("\n• "));return;}
  const now=new Date().toISOString();
  let raidArr;
  try {
    raidArr = await dbInsert("raids",{
      numero_raid:`RAID-${num}`,fazenda_id:fazId,setor,colaborador_nome:colab,coordenador_id:coordId,
      data_ocorrencia:ocorr,data_abertura:now.split("T")[0],status:"Em Andamento",etapa_atual:1,
      sla_status:"ok",created_by:currentUser.id
    });
  } catch(e){ alert("Erro ao criar processo: "+e.message); return; }
  const raid = Array.isArray(raidArr) ? raidArr[0] : raidArr;
  if(!raid?.id){ alert("Erro: processo criado sem ID retornado."); return; }
  let anexo_nome=null, anexo_url=null;
  if(file){
    anexo_nome=file.name;
    const path=`${raid.id}/etapa-1/${Date.now()}-${file.name}`;
    const url=await uploadFile("raid-anexos",path,file);
    if(url) anexo_url=url;
  }
  const resp_ids=[qssmaId,coordId,coordId,manutId||null,rhId||null];
  const etapasRows=DB.etapas_config.map((ec,i)=>({
    raid_id:raid.id,etapa_ordem:i+1,responsavel_id:resp_ids[i],
    inicio:i===0?now:null,campos:i===0?{descricao:desc}:{},
    anexo_nome:i===0?anexo_nome:null,anexo_url:i===0?anexo_url:null
  }));
  await dbInsert("raid_etapas",etapasRows);
  showToast("Processo criado com sucesso! ✅"); closeModal();
  await loadAll(); renderTimelineSelector(); initDashboard(); initProcessos();
}

// ═══════════════════ EXCEL COLABORADORES ═══════════════════
function exportColabXls(){
  const rows=[["nome","matricula","email","cargo","fazenda","gestor"]];
  DB.colaboradores.forEach(c=>{
    const cargo=DB.cargos.find(x=>x.id===c.cargo_id)||{nome:""};
    const faz=DB.fazendas.find(x=>x.id===c.fazenda_id)||{nome:""};
    const gestor=DB.usuarios.find(x=>x.id===c.gestor_id)||{nome:""};
    rows.push([c.nome,c.matricula,c.email||"",cargo.nome,faz.nome,gestor.nome]);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const bom="\uFEFF";
  const blob=new Blob([bom+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`colaboradores-${new Date().toISOString().split("T")[0]}.csv`;
  a.click();
  showToast("Exportado! Abra no Excel ✅");
}

async function importColabXls(input){
  const file=input.files[0]; if(!file)return;
  const text=await file.text();
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2){showToast("Arquivo vazio ou inválido","error");return;}
  // parse CSV (simple, handles quotes)
  const parse=line=>{const r=[];let cur="",inq=false;for(let c of line){if(c==='"'){inq=!inq;}else if(c===","&&!inq){r.push(cur.trim());cur="";}else cur+=c;}r.push(cur.trim());return r;};
  const headers=parse(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z]/g,""));
  let imported=0, erros=0;
  for(let i=1;i<lines.length;i++){
    const vals=parse(lines[i]);
    const get=k=>{const idx=headers.indexOf(k);return idx>=0?(vals[idx]||"").replace(/^"|"$/g,"").trim():"";};
    const nome=get("nome"), matricula=get("matricula");
    if(!nome||!matricula){erros++;continue;}
    try{ await dbUpsert("colaboradores",{nome,matricula,email:get("email")||null},"matricula"); imported++; }catch(e){ erros++; }
  }
  await loadAll(); renderCadastros();
  showToast(`Importados: ${imported} | Erros: ${erros}`);
  input.value="";
}
